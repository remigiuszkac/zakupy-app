a{color:var(--ac2)}

// ====== jednostki i rozpoznawanie wpisu ======
const JEDN = ['szt', 'kg', 'g', 'l', 'ml', 'm', 'opak'];
const KROK = { szt: 1, kg: 0.5, g: 100, l: 0.5, ml: 100, m: 1, opak: 1 };
const ZA = { g: 'kg', ml: 'l' };                         // cena za kg / litr przy gramach i mililitrach
const ilBaz = p => (p.j === 'g' || p.j === 'ml') ? p.q / 1000 : p.q;
const wartosc = p => p.c != null ? p.c * ilBaz(p) : null;
const UNIT = '(szt|sztuk[ia]?|kg|kilo|g|gr|gram(?:y|ów|ow)?|dag|dkg|l|litr(?:y|ów|ow)?|ml|m|mb|metr(?:y|ów|ow)?|op|opak|opakowa(?:nie|nia|ń|n)|paczk[ai]|paczek)';
const RE_PRZOD = new RegExp('^(\\d+(?:[.,]\\d+)?)\\s*(?:' + UNIT + '\\.?|[x×*])?\\s+(.+)$', 'i');
const RE_TYL = new RegExp('^(.+?)\\s+(?:[x×*]\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:' + UNIT + '\\.?)?$', 'i');
const RE_CENA = /\s*(?:[-–—=:]\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:zł|zl|pln)\.?\s*$/i;
function jednostka(u) {
  if (!u) return null;
  u = norm(u);
  if (u.startsWith('szt')) return 'szt';
  if (u === 'kg' || u === 'kilo') return 'kg';
  if (u === 'g' || u === 'gr' || u.startsWith('gram')) return 'g';
  if (u === 'dag' || u === 'dkg') return 'dag';
  if (u === 'l' || u.startsWith('litr')) return 'l';
  if (u === 'ml') return 'ml';
  if (u === 'm' || u === 'mb' || u.startsWith('metr')) return 'm';
  return 'opak';
}
// "2 kg ziemniaki", "mleko 2 l", "2x chleb", "jajka 10 szt (wiejskie) 12,99 zl"
function parsuj(tekst) {
  let t = String(tekst || '').replace(/\s+/g, ' ').trim();
  const p = { n: '', q: 1, j: 'szt', c: null, nt: '', ileJawnie: false, jJawnie: false };
  const nt = [];
  t = t.replace(/\(([^)]*)\)/g, (_, x) => { if (x.trim()) nt.push(x.trim()); return ' '; }).replace(/\s+/g, ' ').trim();
  let cena = null;
  const mc = t.match(RE_CENA);
  if (mc && mc.index > 0) { cena = liczba(mc[1]); t = t.slice(0, mc.index).trim(); }
  let m = t.match(RE_PRZOD);
  if (m && /\p{L}/u.test(m[3])) { p.q = liczba(m[1]); p.j = jednostka(m[2]) || 'szt'; p.jJawnie = !!m[2]; t = m[3]; p.ileJawnie = true; }
  else if ((m = t.match(RE_TYL)) && /\p{L}/u.test(m[1])) { p.q = liczba(m[2]); p.j = jednostka(m[3]) || 'szt'; p.jJawnie = !!m[3]; t = m[1]; p.ileJawnie = true; }
  if (p.j === 'dag') { p.q *= 10; p.j = 'g'; }
  if (!(p.q > 0)) { p.q = 1; p.ileJawnie = p.jJawnie = false; }
  p.n = t.replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g, '').trim();
  p.nt = nt.join(', ');
  if (cena != null && cena > 0) p.c = cena / (ilBaz(p) || 1);   // w wiadomosci cena jest zwykle za calosc
  return p;
}
// tekst z SMS-a / WhatsAppa -> lista produktow (naglowki "Nabial:" ustawiaja dzial)
function parsujTekst(l, tekst) {
  const wynik = [];
  let dzial = null;
  for (let line of String(tekst || '').split(/\r?\n/)) {
    line = line.replace(/^\s*\d+[.)]\s+/, '').replace(/^[^\p{L}\p{N}(]+/u, '').trim();
    if (!line) { dzial = null; continue; }
    const nl = norm(line);
    if (/lista zakup|^razem\b|^suma\b|^lacznie\b|^do kupienia\b/.test(nl)) continue;
    if (/:$/.test(line)) {
      const nd = norm(line.slice(0, -1));
      const d = l.dz.find(x => norm(x.n) === nd);
      dzial = d ? d.id : null;
      continue;
    }
    for (const kawal of line.split(/;|,\s+(?=\D)/)) {
      const p = parsuj(kawal);
      if (!p.n || !/\p{L}/u.test(p.n)) continue;
      if (dzial) p.d = dzial;
      wynik.push(p);
    }
  }
  return wynik;
}

function zapamietaj(l, p, liczDodanie) {
  const k = norm(p.n); if (!k) return;
  const h = l.hist[k] || { k: 0 };
  Object.assign(h, { n: p.n, d: p.d, q: p.q, j: p.j, c: p.c, nt: p.nt || '', t: Date.now() });
  if (liczDodanie) h.k = (h.k || 0) + 1;
  l.hist[k] = h;
  const kl = Object.keys(l.hist);
  if (kl.length > 500) kl.sort((a, b) => l.hist[a].t - l.hist[b].t).slice(0, kl.length - 500).forEach(x => delete l.hist[x]);
}
// dodaje produkt; zwraca { it, juz } (juz = byl juz na liscie do kupienia)
function dodaj(l, p) {
  const k = norm(p.n); if (!k) return null;
  const h = l.hist[k];
  let it = l.poz.find(x => norm(x.n) === k);
  if (it && !it.k) {
    if (p.ileJawnie) { it.q = p.q; if (p.jJawnie) it.j = p.j; }
    if (p.c != null) it.c = p.c;
    if (p.nt) it.nt = p.nt;
    if (p.d) it.d = p.d;
    zapamietaj(l, it, false);
    return { it, juz: true };
  }
  const nowy = {
    id: it ? it.id : uid(), n: p.n.trim(),
    q: p.ileJawnie ? p.q : (h ? h.q : p.q),
    j: p.jJawnie ? p.j : (h ? h.j : p.j),
    c: p.c != null ? p.c : (h && h.c != null ? h.c : null),
    nt: p.nt || (h ? h.nt || '' : ''),
    d: p.d && l.dz.some(d => d.id === p.d) ? p.d : zgadnijDzial(l, p.n),
    k: false, t: Date.now()
  };
  if (it) Object.assign(it, nowy); else l.poz.push(it = nowy);
  zapamietaj(l, it, true);
  return { it, juz: false };
}

function przelacz(id) {
  const l = L(), p = l.poz.find(x => x.id === id); if (!p) return;
  p.k = !p.k; p.kt = Date.now();
  zapisz(); render();
}
$('#tabs').addEventListener('click', e => {

});
$('#sum').addEventListener('click', e => { if (e.target.closest('#bWycz')) wyczyscKupione(); });
function wyczyscKupione() {
  const l = L(), kup = l.poz.filter(p => p.k);
  if (!kup.length) { toast('Nie ma kupionych'); return; }
  l.poz = l.poz.filter(p => !p.k);
  zapisz(); render();
  toast('Usunięto kupione: ' + kup.length, () => { l.poz.push(...kup.filter(k => !l.poz.some(p => p.id === k.id))); zapisz(); render(); });

// ====== dodawanie ======
const wpis = $('#wpis');
$('#fAdd').addEventListener('submit', e => {
  e.preventDefault();
  const t = wpis.value.trim();
  if (!t) { wpis.focus(); return; }
  const l = L(), p = parsuj(t);
  if (!p.n) return;
  const r = dodaj(l, p);
  wpis.value = '';
  zapisz(); render(); po(r);
  wpis.focus();
});
function dodajZHist(k) {
  const l = L(), h = l.hist[k]; if (!h) return;
  const p = parsuj(wpis.value);
  const r = dodaj(l, { n: h.n, q: p.ileJawnie ? p.q : h.q, j: p.jJawnie ? p.j : h.j, c: h.c, nt: h.nt, d: h.d, ileJawnie: true, jJawnie: true });
  wpis.value = '';
  zapisz(); render(); po(r);
}
function po(r) {
  if (!r) return;
  const el = lista.querySelector(`[data-id="${r.it.id}"]`);
  if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  const d = L().dz.find(x => x.id === r.it.d);
  toast(r.juz ? 'Już na liście: ' + r.it.n : 'Dodano: ' + r.it.n + (d && d.id !== 'inne' ? ' → ' + d.n : ''));
}
// podpowiedzi nad polem wpisywania
function renderSug() {
  const l = L(), p = parsuj(wpis.value), q = norm(wpis.value.trim() ? p.n : '');
  let h;
  if (!q) {
    const cz = czeste(l, 12);
    h = cz.length ? '<div class="lbl">Często kupowane</div>' + cz.map(([k, x]) => chipH(k, x)).join('')
      : '<div class="lbl">Wpisz np. „2 kg ziemniaki”, „mleko 2 l”, „chleb”</div>';
  } else {
    const naLiscie = new Set(l.poz.filter(x => !x.k).map(x => norm(x.n)));
    const tr = Object.entries(l.hist).filter(([k]) => !naLiscie.has(k) && (' ' + k).includes(' ' + q))
      .sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || ((b[1].k || 0) - (a[1].k || 0))).slice(0, 8);
    h = tr.length ? tr.map(([k, x]) => chipH(k, x)).join('') : '';
  }
  const s = $('#sug');
  s.innerHTML = h;
  s.classList.toggle('show', !!h);
  mierzDol();
}
let ukryjSug = null;
wpis.addEventListener('focus', () => { clearTimeout(ukryjSug); $('#sug').classList.add('show'); renderSug(); });
wpis.addEventListener('input', renderSug);
wpis.addEventListener('blur', () => { ukryjSug = setTimeout(() => { $('#sug').classList.remove('show'); mierzDol(); }, 150); });
$('#sug').addEventListener('mousedown', e => e.preventDefault());        // nie zabieraj fokusu (klawiatura zostaje)
$('#sug').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) { dodajZHist(b.dataset.h); wpis.focus(); } });

// ---- edycja produktu ----
function edytuj(id) {
  const l = L(), it = l.poz.find(p => p.id === id); if (!it) return;
  if (document.activeElement === wpis) wpis.blur();
  const e = { j: it.j, d: it.d };
  otworz(`<h2>${esc(it.n)}${xBtn}</h2>
    <label class="lb">Nazwa</label><input class="fld" id="eN" value="${esc(it.n)}" autocomplete="off">
    <label class="lb">Ilość</label>
    <div class="ilosc"><button class="pm" type="button" data-pm="-1" aria-label="Mniej">−</button><input class="fld num" id="eQ" inputmode="decimal" value="${fnum(it.q)}"><button class="pm" type="button" data-pm="1" aria-label="Więcej">+</button></div>
    <div class="seg" style="--k:${JEDN.length}" id="eJ">${JEDN.map(j => `<button type="button" data-j="${j}" class="${it.j === j ? 'act' : ''}">${j}</button>`).join('')}</div>
    <label class="lb">Dział</label><div class="chips" id="eD">${l.dz.map(d => `<button type="button" class="chip${it.d === d.id ? ' act' : ''}" data-d="${d.id}">${esc(d.n)}</button>`).join('')}</div>
    <div class="cena"><div><label class="lb" id="eCl"></label><input class="fld num" id="eC" inputmode="decimal" placeholder="—" value="${it.c != null ? fnum(Math.round(it.c * 100) / 100) : ''}"></div><div class="razem" id="eR"></div></div>
    <label class="lb">Notatka</label><input class="fld" id="eT" value="${esc(it.nt || '')}" placeholder="np. marka, „ten tańszy”, sklep" autocomplete="off">
    <div class="btns"><button class="btn pri grow" type="button" id="eOk">Zapisz</button><button class="btn bad" type="button" id="eDel">${IKO.kosz}Usuń</button></div>`);
  const odsw = () => {
    $('#eCl').textContent = 'Cena za 1 ' + (ZA[e.j] || e.j) + ' (zł)';
    const q = liczba($('#eQ').value), c = liczba($('#eC').value);
    $('#eR').innerHTML = (q > 0 && c != null) ? 'Razem <b>' + fzl(c * ilBaz({ q, j: e.j })) + '</b>' : '';
  };
  odsw();
  $('#eQ').addEventListener('input', odsw); $('#eC').addEventListener('input', odsw);
  box.querySelectorAll('[data-pm]').forEach(b => b.addEventListener('click', () => {
    const k = KROK[e.j] || 1, q = liczba($('#eQ').value) || 0;
    let n = Math.round((q + k * +b.dataset.pm) / k) * k;
    if (n <= 0) n = k < 1 ? k : 1;
    $('#eQ').value = fnum(n); odsw();
  }));
  $('#eJ').addEventListener('click', ev => {
    const b = ev.target.closest('[data-j]'); if (!b) return;
    const st = e.j; e.j = b.dataset.j;
    const q = liczba($('#eQ').value) || 1;
    if (st === 'kg' && e.j === 'g') $('#eQ').value = fnum(q * 1000);
    else if (st === 'g' && e.j === 'kg') $('#eQ').value = fnum(q / 1000);
    else if (st === 'l' && e.j === 'ml') $('#eQ').value = fnum(q * 1000);
    else if (st === 'ml' && e.j === 'l') $('#eQ').value = fnum(q / 1000);
    $$('#eJ button').forEach(x => x.classList.toggle('act', x === b)); odsw();
  });
  $('#eD').addEventListener('click', ev => {
    const b = ev.target.closest('[data-d]'); if (!b) return;
    e.d = b.dataset.d; $$('#eD button').forEach(x => x.classList.toggle('act', x === b));
  });
  $('#eOk').addEventListener('click', () => {
    const n = $('#eN').value.trim();
    const q = liczba($('#eQ').value), c = liczba($('#eC').value);
    if (n) it.n = n;
    it.q = q > 0 ? q : 1; it.j = e.j; it.d = e.d;
    it.c = c != null && c >= 0 && $('#eC').value.trim() ? c : null;
    it.nt = $('#eT').value.trim();
    zapamietaj(l, it, false);
    zapisz(); zamknij(); render();
  });
  $('#eDel').addEventListener('click', () => {
    const i = l.poz.indexOf(it); if (i < 0) return;
    l.poz.splice(i, 1); zapisz(); zamknij(); render();
    toast('Usunięto: ' + it.n, () => { l.poz.splice(Math.min(i, l.poz.length), 0, it); zapisz(); render(); });
  });
}

// ---- udostepnianie ----
$('#bUdo').addEventListener('click', oknoUdost);
function tekstListy(l, ceny) {
  const nie = l.poz.filter(p => !p.k);
  const out = [l.ik + ' ' + l.n + ' – lista zakupów'];
  let suma = 0;
  for (const d of l.dz) {
    const its = nie.filter(p => p.d === d.id); if (!its.length) continue;
    out.push('', d.n + ':');
    for (const p of its) {
      const w = wartosc(p);
      if (w != null) suma += w;
      out.push('• ' + p.n + ((p.q === 1 && p.j === 'szt') ? '' : ' ' + fnum(p.q) + ' ' + p.j) + (p.nt ? ' (' + p.nt + ')' : '') + (ceny && w != null ? ' – ' + fzl(w) : ''));
    }
  }
  if (ceny && suma) out.push('', 'Razem ok. ' + fzl(suma));
  return out.join('\n');
}
function oknoUdost() {
  const l = L(), nie = l.poz.filter(p => !p.k);
  if (!nie.length) { zamknij(); toast('Lista „' + l.n + '” jest pusta', null, 'bad'); return; }
  const maCeny = nie.some(p => p.c != null);
  let ceny = maCeny && store.get('udoCeny', false);
  otworz(`<h2>Wyślij „${esc(l.n)}”${xBtn}</h2>
    ${maCeny ? `<label class="chk"><input type="checkbox" id="shC" ${ceny ? 'checked' : ''}> z cenami</label>` : ''}
    <div class="podg" id="shP"></div>
    <div class="g2">
      <button class="btn" type="button" data-u="whatsapp">${IKO.wa}WhatsApp</button>
      <button class="btn" type="button" data-u="sms">${IKO.sms}SMS</button>
      <button class="btn" type="button" data-u="system">${IKO.udost}Inne…</button>
      <button class="btn" type="button" data-u="kopiuj">${IKO.kop}Kopiuj</button>
    </div>`);
  const odsw = () => { $('#shP').textContent = tekstListy(l, ceny); };
  odsw();
  const c = $('#shC'); if (c) c.addEventListener('change', () => { ceny = c.checked; store.set('udoCeny', ceny); odsw(); });
  box.querySelector('.g2').addEventListener('click', e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    wyslij(tekstListy(l, ceny), b.dataset.u);
  });
}
function wyslij(tekst, cel) {
  if (cel === 'kopiuj') { kopiuj(tekst); return; }
  if (NATYWNA) { natyw({ t: 'udostepnij', tekst, cel }); return; }
  const enc = encodeURIComponent(tekst);
  if (cel === 'whatsapp') window.open('https://wa.me/?text=' + enc, '_blank');
  else if (cel === 'sms') location.href = (IOS ? 'sms:&body=' : 'sms:?body=') + enc;
  else if (navigator.share) navigator.share({ text: tekst }).catch(() => { });
  else kopiuj(tekst);
}
function kopiuj(tekst) {
  if (NATYWNA) { natyw({ t: 'kopiuj', tekst }); toast('Skopiowano – wklej w wiadomości'); return; }
  const ok = () => toast('Skopiowano – wklej w wiadomości');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tekst).then(ok, () => kopiujStaro(tekst, ok));
  else kopiujStaro(tekst, ok);
}
function kopiujStaro(tekst, ok) {
  const t = document.createElement('textarea'); t.value = tekst; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:-100px;opacity:0';
  document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Nie udało się skopiować', null, 'bad'); } t.remove();
}
// schowek: w aplikacji przez Androida (window.__schowek), na iPhonie przez przegladarke
let naSchowek = null;
function czytajSchowek(cb) {
  if (NATYWNA) { naSchowek = cb; natyw({ t: 'schowek' }); return; }
  if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(cb, () => toast('Przytrzymaj pole i wybierz „Wklej”', null, 'bad'));
  else toast('Przytrzymaj pole i wybierz „Wklej”', null, 'bad');
}
window.__schowek = t => { const f = naSchowek; naSchowek = null; if (f) f(String(t || '')); };

// ---- wklejanie listy ----
function oknoWklej(startTekst) {
  const l = L();
  otworz(`<h2>Wklej listę${xBtn}</h2>
    <p class="sm mu" style="margin:0">Każdy produkt w osobnej linii albo po przecinku. Ilości i ceny rozpoznam („2 kg ziemniaki”, „mleko x2”, „chleb 4,50 zł”).</p>
    <button class="btn full" type="button" id="wSch" style="margin-top:12px">${IKO.wklej}Wklej ze schowka</button>
    <textarea class="fld" id="wTx" placeholder="np.&#10;mleko 2 l&#10;chleb&#10;2 kg ziemniaki" style="margin-top:10px"></textarea>
    <ul class="prv" id="wPr"></ul>
    <div class="btns"><button class="btn pri grow" type="button" id="wOk" disabled>Dodaj</button></div>`);
  const tx = $('#wTx');
  let kopia = null;
  const odsw = () => {
    const t = tx.value;
    kopia = /^\s*\{[\s\S]*"zakupy"/.test(t) ? t : null;
    if (kopia) {
      $('#wPr').innerHTML = '<li>To jest kopia danych aplikacji<span>wczytaj ją w „Kopia danych”</span></li>';
      $('#wOk').disabled = false; $('#wOk').textContent = 'Wczytaj kopię…'; return;
    }
    const ps = parsujTekst(l, t);
    $('#wPr').innerHTML = ps.slice(0, 60).map(p => {
      const d = l.dz.find(x => x.id === (p.d || zgadnijDzial(l, p.n)));
      return `<li>${esc(p.n)}${p.ileJawnie ? ' · ' + fnum(p.q) + ' ' + p.j : ''}<span>${esc(d ? d.n : 'Inne')}</span></li>`;
    }).join('') + (ps.length > 60 ? `<li>… i ${ps.length - 60} więcej</li>` : '');
    $('#wOk').disabled = !ps.length;
    $('#wOk').textContent = ps.length ? 'Dodaj ' + ps.length + ' ' + ILE(ps.length) : 'Dodaj';
  };
  tx.addEventListener('input', odsw);
  $('#wSch').addEventListener('click', () => czytajSchowek(t => { if (!t.trim()) { toast('Schowek jest pusty', null, 'bad'); return; } tx.value = t; odsw(); }));
  $('#wOk').addEventListener('click', () => {
    if (kopia) { oknoKopia(kopia); return; }
    const ps = parsujTekst(l, tx.value);
    let nowe = 0;
    for (const p of ps) { const r = dodaj(l, p); if (r && !r.juz) nowe++; }
    zapisz(); zamknij(); render();
    toast('Dodano ' + nowe + ' ' + ILE(nowe) + (ps.length > nowe ? ' (' + (ps.length - nowe) + ' już było)' : ''));
  });
  if (typeof startTekst === 'string') { tx.value = startTekst; odsw(); }
}

// ---- dzialy ----
function oknoDzialy() {
  const l = L();
  const rys = () => {
    otworz(`<h2>Działy: ${esc(l.n)}${xBtn}</h2>
      <p class="sm mu" style="margin:0 0 12px">Ustaw kolejność jak idziesz po sklepie. Produkty z usuniętego działu trafią do „Inne”.</p>
      <div id="dzL">${l.dz.map((d, i) => `<div class="rz">
        <input class="fld" value="${esc(d.n)}" data-ren="${d.id}" aria-label="Nazwa działu">
        <button class="ib sm" type="button" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="W górę">↑</button>
        <button class="ib sm" type="button" data-dn="${i}" ${i === l.dz.length - 1 ? 'disabled' : ''} aria-label="W dół">↓</button>
        ${d.id === 'inne' ? '<span class="ib sm" style="background:none"></span>' : `<button class="ib sm del" type="button" data-del="${d.id}" aria-label="Usuń dział">✕</button>`}
      </div>`).join('')}</div>
      <form class="rz" id="dzAdd" style="margin-top:12px"><input class="fld" id="dzN" placeholder="Nowy dział" autocomplete="off"><button class="btn" type="submit">Dodaj</button></form>`, render);
    $('#dzL').addEventListener('change', e => {
      const id = e.target.dataset.ren; if (!id) return;
      const d = l.dz.find(x => x.id === id), n = e.target.value.trim();
      if (d && n) { d.n = n; zapisz(); } else e.target.value = d ? d.n : '';
    });
    $('#dzL').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.up != null || b.dataset.dn != null) {
        const i = +(b.dataset.up != null ? b.dataset.up : b.dataset.dn), j = b.dataset.up != null ? i - 1 : i + 1;
        if (j < 0 || j >= l.dz.length) return;
        [l.dz[i], l.dz[j]] = [l.dz[j], l.dz[i]];
        zapisz(); rys();
        const nb = box.querySelector(`[data-${b.dataset.up != null ? 'up' : 'dn'}="${j}"]`); if (nb && !nb.disabled) nb.focus();
      } else if (b.dataset.del) {
        const d = l.dz.find(x => x.id === b.dataset.del); if (!d) return;
        l.dz = l.dz.filter(x => x !== d);
        l.poz.forEach(p => { if (p.d === d.id) p.d = 'inne'; });
        Object.values(l.hist).forEach(h => { if (h.d === d.id) h.d = null; });
        zapisz(); rys(); toast('Usunięto dział: ' + d.n);
      }
    });
    $('#dzAdd').addEventListener('submit', e => {
      e.preventDefault();
      const n = $('#dzN').value.trim(); if (!n) return;
      l.dz.splice(Math.max(0, l.dz.findIndex(x => x.id === 'inne')), 0, { id: uid(), n });
      zapisz(); rys(); $('#dzN').focus();
    });
  };
  rys();
}

    $('#lsL').addEventListener('change', e => {
      const id = e.target.dataset.ren; if (!id) return;
      const l = listy.find(x => x.id === id), n = e.target.value.trim();
      if (l && n) { l.n = n; zapisz(); } else if (l) e.target.value = l.n;
    });
    $('#lsL').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.ik) {
        const l = listy.find(x => x.id === b.dataset.ik); if (!l) return;
        l.ik = IKONY[(IKONY.indexOf(l.ik) + 1) % IKONY.length]; zapisz(); b.textContent = l.ik;
      } else if (b.dataset.up != null) {
        const i = +b.dataset.up; if (i < 1) return;
        [listy[i - 1], listy[i]] = [listy[i], listy[i - 1]]; zapisz(); rys();
      } else if (b.dataset.del) {
        if (listy.length < 2) return;
        if (pytam !== b.dataset.del) { pytam = b.dataset.del; rys(); return; }
        const i = listy.findIndex(x => x.id === pytam), l = listy[i];
        listy.splice(i, 1); pytam = null;
        if (akt === l.id) akt = listy[0].id;
        zapisz(); rys();
        toast('Usunięto listę: ' + l.n, () => { listy.splice(Math.min(i, listy.length), 0, l); zapisz(); render(); if (sheet.classList.contains('show')) rys(); });
      }
    });
    $('#lsW').addEventListener('click', e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      wzor = b.dataset.w; $$('#lsW .chip').forEach(x => x.classList.toggle('act', x === b));
    });
    $('#lsAdd').addEventListener('submit', e => {
      e.preventDefault();
      const l = nowaLista(wzor, $('#lsN').value.trim() || (wzor === 'pusta' ? 'Nowa lista' : SZABLONY[wzor].n));
      listy.push(l); akt = l.id; zapisz(); zamknij(); window.scrollTo(0, 0);
      toast('Utworzono listę: ' + l.n);
    });
  };
  rys();
}

// ---- kopia danych (np. z Androida na iPhone'a) ----
function oknoKopia(wklejona) {
  const dane = () => JSON.stringify({ zakupy: 1, wersja: APP_WERSJA, data: Date.now(), listy });
  let pyt = false;
  otworz(`<h2>Kopia danych${xBtn}</h2>
    <p class="sm mu" style="margin:0">Wszystkie listy, działy i historia w jednej wiadomości. Wyślij ją sobie i wczytaj na drugim telefonie.</p>
    <div class="g2"><button class="btn" type="button" id="kWys">${IKO.udost}Wyślij kopię</button><button class="btn" type="button" id="kKop">${IKO.kop}Kopiuj</button></div>
    <label class="lb" style="margin-top:20px">Wczytaj kopię</label>
    <button class="btn full" type="button" id="kSch">${IKO.wklej}Wklej ze schowka</button>
    <textarea class="fld" id="kTx" placeholder="Wklej tu kopię {&quot;zakupy&quot;:…}" style="margin-top:10px;min-height:90px"></textarea>
    <div class="warn">Wczytanie zastąpi wszystkie obecne listy na tym telefonie.</div>
    <div class="btns"><button class="btn bad grow" type="button" id="kOk" disabled>Wczytaj kopię</button></div>`);
  const tx = $('#kTx');
  const spr = () => { pyt = false; $('#kOk').textContent = 'Wczytaj kopię'; $('#kOk').disabled = !/"zakupy"/.test(tx.value); };
  tx.addEventListener('input', spr);
  $('#kWys').addEventListener('click', () => wyslij(dane(), 'system'));
  $('#kKop').addEventListener('click', () => kopiuj(dane()));
  $('#kSch').addEventListener('click', () => czytajSchowek(t => { tx.value = t; spr(); }));
  $('#kOk').addEventListener('click', () => {
    let d;
    try { d = JSON.parse(tx.value.trim()); } catch (e) { toast('To nie jest poprawna kopia', null, 'bad'); return; }
    if (!d || !d.zakupy || !Array.isArray(d.listy) || !d.listy.length) { toast('To nie jest poprawna kopia', null, 'bad'); return; }
    if (!pyt) { pyt = true; $('#kOk').textContent = 'Na pewno? Stuknij jeszcze raz'; return; }
    listy = d.listy.map(napraw); akt = listy[0].id;
    zapisz(); zamknij(); render(); toast('Wczytano kopię: ' + listy.length + ' list');
  });
  if (typeof wklejona === 'string') { tx.value = wklejona; spr(); }
}

// ---- o aplikacji / aktualizacje ----
function oknoInfo() {
  const gdzie = NATYWNA ? 'Android' : (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? 'aplikacja z ekranu początkowego' : 'przeglądarka');
  const wer = NATYWNA ? (APP.update ? 'aktualizacja z ' + fdt(APP.update) : 'wersja z instalacji') : (APP_BUILD.startsWith('__') ? 'wersja robocza' : 'wydanie ' + APP_BUILD);
  otworz(`<h2>Zakupy v${APP_WERSJA}${xBtn}</h2>
    <div class="info">${esc(gdzie)} · ${esc(wer)}${NATYWNA && APP.natywna ? ' · APK ' + esc(APP.natywna) : ''}</div>
    <p class="sm mu">Dane są tylko w tym telefonie i działają bez internetu. Nowe wersje przychodzą same przy uruchomieniu (z GitHuba).</p>
    <div class="btns"><button class="btn pri grow" type="button" id="iAkt">Sprawdź aktualizacje</button></div>`);
  $('#iAkt').addEventListener('click', () => { sprawdzAktualizacje(true); });
}
function sprawdzAktualizacje(reczne) {
  if (NATYWNA) { natyw({ t: 'aktualizuj' }); if (reczne) toast('Sprawdzam aktualizacje…'); return; }
  sprawdzPWA(reczne);
}
window.__aktualizacja = s => toast({ aktualna: 'Masz najnowszą wersję (v' + APP_WERSJA + ')', blad: 'Nie udało się sprawdzić – brak internetu?', wylaczone: 'Aktualizacje działają w zainstalowanej aplikacji' }[s] || s, null, s === 'aktualna' ? '' : 'bad');

// ====== PWA (iPhone): praca bez internetu + aktualizacje z GitHub Pages ======
function pasek(t) { const p = $('#pasek'); p.textContent = t || ''; p.classList.toggle('show', !!t); }
let sprawdzanie = false;
async function sprawdzPWA(reczne) {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:' || APP_BUILD.startsWith('__')) { if (reczne) window.__aktualizacja('wylaczone'); return; }
  if (sprawdzanie) return;
  sprawdzanie = true;
  pasek('Sprawdzam aktualizacje…');
  try {
    const r = await fetch('version.json?sprawdz=' + Date.now(), { cache: 'no-store' });
    const v = await r.json();
    if (v.build && v.build !== APP_BUILD) {
      pasek('Pobieram nową wersję…');
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update().catch(() => { });
      await fetch('index.html?sprawdz=' + Date.now(), { cache: 'no-store' });   // service worker zapisze nowa wersje
      pasek('Uruchamiam nową wersję…');
      setTimeout(() => location.reload(), 300);
      return;
    }
    pasek(null);
    if (reczne) window.__aktualizacja('aktualna');
  } catch (e) {
    pasek(null);
    if (reczne) window.__aktualizacja('blad');
  } finally { sprawdzanie = false; }
}
if (!NATYWNA && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => { });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  sprawdzPWA(false);
  let ost = Date.now();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ost > 30 * 60e3) { ost = Date.now(); sprawdzPWA(false); } });
}

// ====== drobiazgi ======
function toast(msg, cofnij, typ) {
  const t = $('#toast'), b = t.querySelector('button');
  t.querySelector('span').textContent = msg;
  b.textContent = cofnij ? 'Cofnij' : '';
  b.onclick = cofnij ? () => { t.className = ''; cofnij(); } : null;
  t.className = 'show' + (typ === 'bad' ? ' bad' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = '', cofnij ? 5000 : 2600);
}
// wysokosc dolnego paska (lista nie chowa sie pod nim)
const dol = $('#dol');
function mierzDol() { document.documentElement.style.setProperty('--dol', dol.offsetHeight + 'px'); }
if (window.ResizeObserver) new ResizeObserver(mierzDol).observe(dol);
mierzDol();
// iPhone: klawiatura nie zmniejsza strony, wiec dolny pasek podnosimy recznie
if (!NATYWNA && window.visualViewport) {
  const vv = window.visualViewport;
  const pod = () => { const o = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); dol.style.transform = o > 40 ? `translateY(${-o}px)` : ''; };
  vv.addEventListener('resize', pod); vv.addEventListener('scroll', pod);
}
// iPhone w Safari: podpowiedz, jak dodac do ekranu poczatkowego
if (!NATYWNA && IOS && !navigator.standalone && !store.get('iosOk', false)) {
  const d = document.createElement('div');
  d.className = 'ios';
  d.innerHTML = '<b>Zainstaluj na iPhonie</b>Stuknij <b style="display:inline">Udostępnij</b> (kwadrat ze strzałką) → <b style="display:inline">Do ekranu początkowego</b>. Aplikacja będzie działać bez internetu i sama się aktualizować.<br><button class="btn sm" type="button">Rozumiem</button>';
  d.querySelector('button').addEventListener('click', () => { store.set('iosOk', true); d.remove(); });
  lista.before(d);
}

// ====== przycisk Wstecz w Androidzie ======
window.__wstecz = () => {
  if (sheet.classList.contains('show')) zamknij();
  else if (document.activeElement === wpis) wpis.blur();
  else natyw({ t: 'wyjdz' });
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('show')) zamknij(); });

// ====== start ======
render();
</script>
